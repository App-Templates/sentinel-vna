version: "1.1.0"
last_updated: "2026-02-21T00:00:00Z"

data_gap:
  enabled: true
  max_gap_hours: 4
  severity: P1

revenue_anomaly:
  P0:
    drop_percent: -15
    duration_hours: 2
  P1:
    drop_percent: -10
    duration_hours: 2
  P2:
    drop_percent: -5
    duration_hours: 4

drift_detection:
  enabled: true
  window_days: 7
  threshold_percent: -8

drift_regression:
  enabled: true
  window_days_min: 14
  window_days_max: 30
  slope_threshold_percent_per_day: -2.0
  cumulative_drop_threshold_percent: -15.0
  min_data_points: 10

comparative_alerting:
