version: "1.1.3"
last_updated: "2026-02-21T14:50:00Z"

data_gap:
  enabled: true
  max_gap_hours: 4
  severity: P1

revenue_anomaly:
  P0:
    drop_percent: -15
    duration_hours: 2
  P1:
    drop_percent: -10
    duration_hours: 2
  P2:
    drop_percent: -5
    duration_hours: 4

drift_detection:
  enabled: true
  window_days: 7
  threshold_percent: -8

drift_regression:
  enabled: true
  window_days_min: 14
  window_days_max: 30
  slope_threshold_percent_per_day: -2.0
  cumulative_drop_threshold_percent: -15.0
  min_data_points: 10

comparative_alerting:
  yesterday_comparison:
    enabled: true
    threshold_percent: -30
    severity_mapping:
      below_minus_30: P0
      below_minus_20: P1
      below_minus_10: P2
  moving_average_14d:
    enabled: true
    divergence_threshold_percent: -25
    sustained_hours: 3
    severity: P1

dual_thresholds:
  enabled: true
  operational:
    revenue_drop_percent: -30
    yesterday_delta_percent: -30
    ma_14d_divergence_percent: -25
  attention:
    revenue_drop_percent: -15
    yesterday_delta_percent: -15
    ma_14d_divergence_percent: -12
  attention_severity: P2-WATCH

margin_alert:
  enabled: true
  ecpm_drop_thresholds:
    P1:
      drop_percent: -25
      duration_hours: 3
    P2:
      drop_percent: -15
      duration_hours: 4
  min_impressions: 1000
  baseline_weeks: 7

coverage_zero_alert:
  enabled: true
  coverage_threshold: 0.001  # Coverage below 0.1% considered "zero"
  min_bacino: 100  # Minimum bacino to consider coverage-zero significant
  consecutive_hours: 2  # Must be zero for 2+ consecutive hours to trigger
  severity: P1  # Coverage-zero is always critical
  baseline_weeks: 7  # Compare to 7-week same-hour baseline

pricing_rule_alert:
  enabled: true
  coverage_drop_threshold: -15  # Coverage must drop at least 15%
  cpm_spike_threshold: 20  # eCPM must increase at least 20%
  correlation_strength: -0.7  # Pearson correlation coefficient (negative = inverse correlation)
  severity: P1  # Pricing rule issues are critical
  min_impressions: 500  # Minimum impressions for reliable eCPM calculation
  baseline_weeks: 7

near_zero:
  revenue_threshold_eur: 100
  coverage_threshold: 0.05
  consecutive_periods: 3

triage:
  traffic_driven_threshold: -10
  coverage_driven_threshold: -10

top_contributors:
  top_n: 15
  min_quota_percent: 1

geo_clusters:
  ITA:
    - IT
  ES:
    - ES
  OTHER:
