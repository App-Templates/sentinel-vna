scheduling:
  interval_hours: 2
  recheck_interval_minutes: 5
  channels:
    - GOOGLE
    - OPEN_BIDDING
  weekend_schedule:
    enabled: true
    times_per_day: 2  # Run 2x/day on weekends (vs 12x weekday)
    run_hours: [10, 18]  # Run at 10:00 and 18:00 UTC on Sat/Sun

data_sources:
  athena_timeout_seconds: 30
  athena_retry_count: 1
  cache_ttl_hours: 24

notifications:
  slack_enabled: true
  email_enabled: true

slack_notifications:
  webhook_url: ""  # Populated via admin UI
  channel: "sentinel-alerts"
  immediate_severities: ["P0"]
  digest_severities: ["P1", "P2"]
  digest_time_utc: "08:00"  # Daily digest sent at 8 AM UTC
