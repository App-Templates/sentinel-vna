  notes: |
    - GOOGLE is a legacy alias for GOOGLE_ADEX pre-v1.2 rename; both map to Open_Market.
    - TAM (Transparent Ad Marketplace) is classified as "Other" pending clearer taxonomy
      (deferred to v1.4 OPS-02 if upstream exposes real sell_type).
    - Unknown channel_group values default to "Other" in ETL (graceful degradation).

# Channel group → sell_type_proxy mapping.
# Keys = sell_type_proxy values (written to parquet).
# Values = list of channel_group values that map TO that sell_type.

# ─────────────────────────────────────────────────────────────────────────
# MAP-06 (Phase 17.1, Marco TAM&Yield audit response 2026-05-18 — Verbatim):
#
#   "Open Market per noi comprende i seguenti:
#       Google AdEx
#       Open Bidding
#       Header Bidding Magnite
#       Header Bidding PubMatic
#       Header Bidding TAM (>> ti segnalo che il team AdOps ha deciso di
#                              spegnere questa fonte dato nell'ultima
#                              settimana)"
#
# PBI Open Market = {GOOGLE_ADEX, OPEN_BIDDING, HEADER_BIDDING_MAGNITE,
#                    HEADER_BIDDING_PUBMATIC, TAM}  ← 5 channels
#
# DIVERGENCE BY DESIGN (operator decision 2026-05-19, plan-checker iter-1):
# Sentinel's YAML Open_Market KEEPS the 3-channel narrow definition below
# for the Phase 14 SELL_TYPE_LABELS UI affordance (5-bucket dropdown
# shipped 2026-04-30). Collapsing all 5 PBI channels into YAML Open_Market
# would remove Header_Bidding + Other filter granularity from the operator
# dashboard and force a cascading PublishersPage.tsx revision outside
# Phase 17.1 scope.
#
# PBI-parity reconciliation is a CORR-04 channel-scope-badge UI concern,
# not a backend grouping concern. The two taxonomies (Sentinel sell_type
# proxy vs Marco PBI Open Market) are semantically distinct: the former
# is a dashboard filter affordance, the latter is a reporting bucket.
#
# TAM DEPRECATION: AdOps announced shutdown (Marco email above). The TAM
# bucket stays here so the cristallizzato gen-mar parquet (which contains
# TAM rows) keeps mapping cleanly. Once parquet is rebuilt without TAM
# (Phase 18+), the `Other: - TAM` line can be dropped.
# ─────────────────────────────────────────────────────────────────────────
Open_Market:
  - GOOGLE_ADEX
  - OPEN_BIDDING
  - GOOGLE          # legacy alias for GOOGLE_ADEX

Header_Bidding:
  - HEADER_BIDDING_MAGNITE
  - HEADER_BIDDING_PUBMATIC

Direct:
  - DIRECT

Deal:
  - DEAL

Other:
  - TAM
